<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f4f7fb;
color:#111b32;
}

.top{
height:76px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
box-shadow:0 2px 12px #0000000c;
}

.logo{
font-size:27px;
font-weight:900;
color:#075bbb;
}
.logo span{color:#e53935}

.whatsapp-top{
background:#20c76a;
color:white;
text-decoration:none;
padding:13px 20px;
border-radius:16px;
font-size:15px;
font-weight:bold;
}

.hero{
margin:28px;
padding:34px 30px;
border-radius:28px;
color:white;
background:linear-gradient(135deg,#075bbb,#168ee8);
position:relative;
overflow:hidden;
}

.hero:after{
content:"✈️";
position:absolute;
left:25px;
bottom:-30px;
font-size:125px;
opacity:.1;
}

.hero h1{
font-size:34px;
font-weight:900;
margin-bottom:9px;
}

.hero p{
font-size:16px;
opacity:.92;
margin-bottom:22px;
}

.search{
width:100%;
height:57px;
border:0;
outline:0;
border-radius:18px;
padding:0 20px;
font-size:16px;
background:white;
}

.filters{
display:flex;
gap:10px;
overflow-x:auto;
padding:0 28px 22px;
scrollbar-width:none;
}

.filters::-webkit-scrollbar{display:none}

.filter{
border:0;
background:white;
color:#075bbb;
border-radius:16px;
padding:13px 20px;
white-space:nowrap;
font-size:14px;
font-weight:bold;
box-shadow:0 3px 12px #0000000c;
}

.filter.active{
background:#075bbb;
color:white;
}

#countries{
padding:0 28px 40px;
}

.country{
margin-bottom:28px;
background:white;
border-radius:28px;
overflow:hidden;
box-shadow:0 5px 22px #0000000c;
}

/* تەنها سەری وڵات */
.country-head{
min-height:190px;
position:relative;
overflow:hidden;
color:white;
padding:25px 20px;
background:linear-gradient(135deg,#075bbb,#168ee8);
}

.country-head:before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(circle at 75% 25%,#ffffff30,transparent 20%),
linear-gradient(135deg,#ffffff08,transparent 55%);
}

.country-head:after{
content:"";
position:absolute;
left:0;
right:0;
bottom:-55px;
height:130px;
background:#07529b35;
border-radius:50% 50% 0 0;
}

.country-landmark{
position:absolute;
right:28%;
bottom:-30px;
font-size:125px;
line-height:1;
opacity:.20;
z-index:1;
pointer-events:none;
}

.country-plane{
position:absolute;
right:48%;
top:18px;
font-size:38px;
opacity:.30;
transform:rotate(-10deg);
z-index:2;
}

.country-title{
position:relative;
z-index:5;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.country-left{
display:flex;
align-items:center;
gap:14px;
}

.country-flag{
width:72px;
height:72px;
border-radius:20px;
background:#ffffff20;
border:1px solid #ffffff45;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
}

.country-name{
font-size:29px;
font-weight:900;
}

.country-sub{
margin-top:7px;
font-size:14px;
}

.country-badges{
display:flex;
flex-direction:column;
gap:8px;
}

.country-badge{
background:#ffffff20;
border:1px solid #ffffff45;
padding:8px 13px;
border-radius:22px;
font-size:11px;
white-space:nowrap;
}

/* پلانەکان - وەک خۆی */
.plans{
padding:13px;
background:#f9fbfe;
}

.plan{
min-height:70px;
background:white;
border:1px solid #e9edf3;
border-radius:17px;
margin-bottom:10px;
padding:8px 9px;
display:flex;
align-items:center;
gap:7px;
box-shadow:0 2px 8px #00000006;
}

.plan:last-child{
margin-bottom:0;
}

.plan-icon{
width:47px;
min-width:47px;
height:47px;
border-radius:14px;
background:linear-gradient(145deg,#edf6ff,#dfeefe);
color:#0764be;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:900;
}

.plan-info{
flex:1;
min-width:70px;
}

.plan-data{
font-size:18px;
font-weight:900;
}

.plan-days{
font-size:11px;
color:#9299a7;
margin-top:4px;
}

.plan-price{
background:#ffe8e8;
color:#df3333;
border-radius:15px;
padding:11px 10px;
font-size:12px;
font-weight:900;
white-space:nowrap;
}

.buy{
border:0;
background:linear-gradient(135deg,#16bd63,#0bb95c);
color:white;
border-radius:14px;
padding:11px 11px;
font-size:12px;
font-weight:900;
white-space:nowrap;
cursor:pointer;
}

.turkey,.europe{
background:linear-gradient(135deg,#075bbb,#168ee8);
}

.america{
background:linear-gradient(135deg,#124e96,#1877d4);
}

.global{
background:linear-gradient(135deg,#075bbb,#00a4b8);
}

.middle{

}

.asia{
background:linear-gradient(135deg,#075bbb,#008fba);
}

.levant{

}

.empty{
background:white;
border-radius:20px;
padding:40px;
text-align:center;
color:#777;
}

دەمەوێت ئەم پلانەی eSIM بکڕم:

🌍 وڵات: ${c.name}
📦 پلان: ${p[0]}
📅 ماوە: ${p[1]}
💰 نرخ: ${p[2]}

تکایە یارمەتیم بدەن بۆ کڕین.`;

window.location.href=
"https://wa.me/"+
WHATSAPP+
"?text="+
encodeURIComponent(message);

}


function display(){

const search=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const container=
document.getElementById("countries");

container.innerHTML="";

let found=false;


countries.forEach((c,ci)=>{

if(
currentFilter!=="all" &&
c.class!==currentFilter
)return;


const searchable=
(
c.name+" "+
c.sub+" "+
c.region+" "+
c.plans.map(p=>p.join(" ")).join(" ")
).toLowerCase();


if(
search &&
!searchable.includes(search)
)return;


found=true;

let plansHTML="";


c.plans.forEach((p,pi)=>{

const icon=
p[0].toLowerCase().includes("unlimited")
?"∞"
:"▮▮▮";


plansHTML+=`

<div class="plan">

<div class="plan-icon">
${icon}
</div>

<div class="plan-info">

<div class="plan-data">
${p[0]}
</div>

<div class="plan-days">
${p[1]}
</div>

</div>

<div class="plan-price">
${p[2]}
</div>

<button
class="buy"
onclick="buy(${ci},${pi})">
🛒 کڕین
</button>

</div>

`;

});


container.innerHTML+=`

<section class="country">

<div class="country-head ${c.class}">

<div class="country-plane">
✈️
</div>

<div class="country-landmark">
${c.landmark}
</div>

<div class="country-title">

<div class="country-left">

<div class="country-flag">
${c.flag}
</div>

<div>

<div class="country-name">
${c.name}
</div>

<div class="country-sub">
✈️ ${c.sub}
</div>

</div>

</div>


<div class="country-badges">

<div class="country-badge">
eSIM 📶
</div>

<div class="country-badge">
📍 ${c.region}
</div>

</div>

</div>

</div>


<div class="plans">

${plansHTML}

</div>

</section>

`;

});


if(!found){

container.innerHTML=`
<div class="empty">
🔎 هیچ پلانێک نەدۆزرایەوە
</div>
`;

}

}


function setFilter(filter,button){

currentFilter=filter;

document
.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

display();

}


document
.getElementById("search")
.addEventListener("input",display);


display();

</script>

</body>
</html>
