*{box-sizing:border-box;margin:0;padding:0}

body{

.top{
height:58px;
background:#fff;

align-items:center;

.logo{

}

text-align:center;

}

.hero h1{

}

.hero p{

}

}

flex:1;
border:0;

border-radius:14px;
padding:13px 16px;
font-size:15px;
}

.search button{
border:0;
border-radius:14px;
padding:0 18px;
background:#ffd21f;
font-weight:bold;
cursor:pointer;
}

.filters{
padding:13px 10px;
display:flex;
gap:7px;
overflow-x:auto;
background:#f4f7fb;
}

.filters button{
border:0;
background:#fff;
color:#075bbb;
padding:8px 14px;
border-radius:20px;
white-space:nowrap;
font-weight:bold;
box-shadow:0 2px 8px #0001;
}

.filters button.active{
background:#075bbb;

}

.container{
max-width:900px;
margin:auto;

.country{

}

height:120px;
border-radius:50%;
background:#ffffff18;
left:-30px;
top:-45px;
}

align-items:center;

.country-name{
font-size:22px;
font-weight:900;
}

.country-sub{
font-size:12px;
margin-top:4px;
opacity:.9;
}

.country-badge{
background:#ffffff22;
border:1px solid #ffffff35;
padding:6px 10px;
border-radius:15px;
font-size:11px;
white-space:nowrap;
}

.turkey{background:linear-gradient(135deg,#d71932,#ed5b68)}
.europe{background:linear-gradient(135deg,#1557c0,#3c91ed)}
.america{background:linear-gradient(135deg,#123c83,#287de0)}
.asia{background:linear-gradient(135deg,#007c74,#16a69b)}
.middle{background:linear-gradient(135deg,#a96b00,#e39a19)}
.global{background:linear-gradient(135deg,#4b42a6,#756cf0)}

/* plans */

.plans{
padding:9px;
}

.plan{
display:grid;
grid-template-columns:48px 1fr auto auto;
align-items:center;
gap:10px;
padding:10px;

border-radius:16px;
}

.icon{

height:43px;

align-items:center;
justify-content:center;
background:#eaf3ff;

font-size:20px;
font-weight:900;
}

.info strong{
display:block;
font-size:17px;
color:#102f5c;
}

.info small{
display:block;
font-size:12px;
color:#7b8798;
margin-top:3px;
}

.price{
background:#ed1b2f;
color:white;
padding:8px 12px;
border-radius:18px;
font-size:13px;
font-weight:900;
white-space:nowrap;
}

.buy{
border:0;
background:#20c968;
color:white;
padding:8px 13px;
border-radius:18px;
font-size:13px;
font-weight:bold;
cursor:pointer;
white-space:nowrap;
}

.buy:active{
transform:scale(.96);
}

.empty{
text-align:center;
background:#fff;
border-radius:18px;
padding:40px 15px;
margin-top:20px;
color:#68788d;
}

footer{
background:#071f49;
color:white;
text-align:center;
padding:28px 15px;

.pay{

justify-content:center;

function buy(ci,pi){

const c=countries[ci];
const p=c.plans[pi];

const msg=
`سڵاو 👋

دەمەوێت ئەم پلانەی eSIM بکڕم:

🌍 وڵات: ${c.name}
📦 پلان: ${p[0]}
📅 ماوە: ${p[1]}
💰 نرخ: ${p[2]}

تکایە یارمەتیم بدەن بۆ کڕین.`;

window.location.href=
"https://wa.me/"+WHATSAPP+
"?text="+encodeURIComponent(msg);

}


/* =========================

========================= */

function display(list=countries){

<h2>هیچ پلانێک نەدۆزرایەوە ❌</h2>
<p style="margin-top:8px">گەڕانێکی تر تاقی بکەرەوە</p>
</div>`;

return;
}

<div class="country-head ${c.class}">

<div class="country-title">

<div>

${c.name}
</div>

${c.sub}
</div>

</div>

<div class="country-badge">
eSIM
</div>

</div>

</div>

<div class="plans">
`;

c.plans.forEach((p,pi)=>{

html+=`

<div class="plan">

<div class="icon">
${p[0].toLowerCase()=="unlimited"?"∞":"▮▮"}
</div>

<div class="info">

<strong>${p[0]}</strong>

<small>
📅 ${p[1]}
</small>

</div>

<div class="price">
${p[2]}
</div>

<button
class="buy"
onclick="buy(${ci},${pi})">
کڕین
</button>

</div>
`;

});

html+=`
</div>
</section>
`;

box.innerHTML+=html;

});

}


/* =========================

========================= */

function makeFilters(){

const box=document.getElementById("filters");

const regions=[
["هەمووی","all"],
["ئوروپا","ئوروپا"],
["ئاسیا","ئاسیا"],
["ئەمەریکا","ئەمەریکا"],
["ڕۆژهەڵاتی ناوەڕاست","ڕۆژهەڵاتی ناوەڕاست"],
["جیهانی","جیهانی"]
];

regions.forEach((r,i)=>{

const b=document.createElement("button");

b.textContent=r[0];

if(i===0)b.classList.add("active");

b.onclick=()=>{

document
.querySelectorAll(".filters button")
.forEach(x=>x.classList.remove("active"));

b.classList.add("active");

if(r[1]=="all"){
display(countries);
}else{
display(countries.filter(x=>x.region==r[1]));
}

};

box.appendChild(b);

});

}


/* =========================
SEARCH
========================= */

function searchPlans(){

const q=
document.getElementById("search")
.value
.toLowerCase()
.trim();

if(!q){
display(countries);
return;
}

const result=countries.filter(c=>{

if(c.name.toLowerCase().includes(q))return true;

return c.plans.some(p=>
p.join(" ").toLowerCase().includes(q)
);

});

display(result);

}

document
.getElementById("search")
.addEventListener("keydown",e=>{
if(e.key==="Enter")searchPlans();
});


makeFilters();
display();
