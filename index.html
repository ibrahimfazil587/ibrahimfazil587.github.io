}

  padding:15px 18px;
  border:none;
  border-radius:15px;
  font-size:16px;
  outline:none;
}

.search-box button{
  border:none;
  background:#ffd21f;

}

.filters{

  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:18px 10px;

.filters button{

  padding:10px 16px;
  border-radius:20px;
  background:white;

  box-shadow:0 3px 12px #0001;

.filters button.active{

}

.container{
  max-width:1100px;
  margin:auto;
  padding:10px 12px 50px;
}

.country{
  background:white;
  margin:25px 0;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 8px 30px #164a7a18;
}

.country-head{
  color:white;
  padding:22px;
  background:linear-gradient(135deg,#075bbb,#0a82df);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.country-head h2{
  font-size:25px;
}

.country-head span{
  background:#ffffff22;
  padding:7px 12px;
  border-radius:15px;
  font-size:13px;
}

.plans{
  padding:12px;
}

.plan{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:15px;
  padding:15px;
  margin:8px 0;
  border:1px solid #e2eaf3;
  border-radius:17px;
  background:#f9fbff;
}

.plan:hover{
  background:#eef6ff;
  transform:translateY(-1px);
}

.plan-info strong{
  display:block;
  font-size:18px;
  color:#082c61;
}

.plan-info small{
  color:#65758b;
}

.price{
  background:#e7192e;
  color:white;
  font-weight:bold;
  padding:11px 18px;
  border-radius:25px;
  white-space:nowrap;
}

.buy{
  border:none;
  background:#25d366;
  color:white;
  padding:11px 18px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.buy:hover{
  background:#1ebe5d;
}

.empty{
  text-align:center;
  padding:40px;
  color:#718096;
}

footer{
  background:#071f49;
  color:white;
  text-align:center;
  padding:30px 15px;
  margin-top:30px;
}

footer .pay{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:15px 0;
}

.pay span{
  padding:10px 18px;
  border-radius:10px;
  background:#ffffff15;
  font-weight:bold;
}

@media(max-width:650px){

  header h1{
    font-size:25px;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    padding:13px;
  }

  .country-head{
    flex-direction:column;
    text-align:center;
  }

  .plan{
    grid-template-columns:1fr;
    text-align:center;
  }

  .price,
  .buy{
    width:100%;
  }
}

/* =========================
   WHATSAPP BUY
========================= */

function buy(countryIndex,planIndex){

  const country = countries[countryIndex];
  const plan = country.plans[planIndex];

  const message =
`سڵاو 👋

دەمەوێت ئەم پلانەی eSIM بکڕم:

🌍 وڵات: ${country.name}
📦 پلان: ${plan[0]}
📅 ماوە: ${plan[1]}
💰 نرخ: ${plan[2]}

تکایە یارمەتیم بدەن بۆ تەواوکردنی کڕین.`;

  const whatsappURL =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);

  /* بۆ مۆبایل window.location زۆر جێگیرترە */
  window.location.href = whatsappURL;
}


/* =========================
   DISPLAY
========================= */

function displayCountries(list = countries){

  const container = document.getElementById("countries");

  container.innerHTML = "";

  if(list.length === 0){

    container.innerHTML =
      `<div class="empty">
        هیچ پلانێک نەدۆزرایەوە ❌
      </div>`;

    return;
  }

  list.forEach((country)=>{

    const countryIndex = countries.indexOf(country);

    let html = `
      <section class="country">

        <div class="country-head">
          <h2>${country.name}</h2>
          <span>${country.region}</span>
        </div>

        <div class="plans">
    `;

    country.plans.forEach((plan,planIndex)=>{

      html += `
        <div class="plan">

          <div class="plan-info">
            <strong>${plan[0]}</strong>
            <small>ماوە: ${plan[1]}</small>
          </div>

          <div class="price">
            ${plan[2]}
          </div>

          <button
            class="buy"
            onclick="buy(${countryIndex},${planIndex})">
            کڕین 🛒
          </button>

        </div>
      `;

    });

    html += `
        </div>
      </section>
    `;

    container.innerHTML += html;

  });
}


/* =========================
   FILTER BUTTONS
========================= */

function createFilters(){

  const filters = document.getElementById("filters");

  const regions = [
    "هەمووی",
    "ئوروپا",
    "ئاسیا",
    "ئەمەریکا",
    "ڕۆژهەڵاتی ناوەڕاست",
    "جیهانی"
  ];

  regions.forEach((region,index)=>{

    const button = document.createElement("button");

    button.textContent = region;

    if(index === 0){
      button.classList.add("active");
    }

    button.onclick = ()=>{

      document
        .querySelectorAll(".filters button")
        .forEach(b=>b.classList.remove("active"));

      button.classList.add("active");

      if(region === "هەمووی"){
        displayCountries(countries);
      }else{
        displayCountries(
          countries.filter(c=>c.region === region)
        );
      }

    };

    filters.appendChild(button);

  });

}


/* =========================
   SEARCH
========================= */

function searchPlans(){

  const q =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  if(!q){
    displayCountries(countries);
    return;
  }

  const result = countries.filter(country=>{

    const countryMatch =
      country.name.toLowerCase().includes(q);

    const planMatch =
      country.plans.some(plan =>
        plan.join(" ").toLowerCase().includes(q)
      );

    return countryMatch || planMatch;

  });

  displayCountries(result);
}


/* ENTER KEY */

document
  .getElementById("search")
  .addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){
      searchPlans();
    }

  });


/* START */

createFilters();
displayCountries();
