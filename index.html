<!DOCTYPE html>

<title>eSIM Online</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f3f7ff;
  color:#102a43;
}

/* TOP BAR */

.topbar{
  background:white;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 12px #00000012;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:20px;
  font-weight:900;
  color:#075bbb;
}

.whatsapp-top{
  text-decoration:none;
  background:#20c967;
  color:white;
  padding:8px 14px;
  border-radius:22px;
  font-weight:bold;
  font-size:14px;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#075bbb,#138ce8);
  color:white;
  padding:28px 15px 30px;
  text-align:center;
}

header h1{
  font-size:31px;
  margin-bottom:8px;
}

header p{
  opacity:.9;
  font-size:15px;
}

.search{
  max-width:700px;
  margin:20px auto 0;
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  border:none;
  outline:none;
  border-radius:16px;
  padding:14px 18px;
  font-size:16px;
}

.search button{
  border:none;
  background:#ffd21f;
  color:#14213d;
  border-radius:16px;
  padding:0 20px;
  font-weight:bold;
  cursor:pointer;
}

/* FILTER */

.filters{
  padding:16px 10px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.filters button{
  border:0;
  background:white;
  color:#075bbb;
  padding:9px 15px;
  border-radius:22px;
  font-weight:bold;
  box-shadow:0 3px 12px #00000010;
  cursor:pointer;
}

.filters button.active{
  background:#075bbb;
  color:white;
}

/* MAIN */

.container{
  max-width:1000px;
  margin:auto;
  padding:5px 12px 50px;
}

/* COUNTRY */

.country{
  background:white;
  border-radius:25px;
  overflow:hidden;
  margin:24px 0;
  box-shadow:0 8px 30px #1a4f7a16;
}

.country-head{
  background:linear-gradient(135deg,#075bbb,#168ee8);
  color:white;
  padding:23px 20px;
  text-align:center;
}

.country-name{
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.country-region{
  display:inline-block;
  background:#ffffff22;
  border:1px solid #ffffff35;
  padding:7px 18px;
  border-radius:20px;
  font-size:14px;
}

/* PLANS */

.plans{
  padding:15px;
}

.plan{
  display:grid;
  grid-template-columns:70px 1fr auto auto;
  align-items:center;
  gap:14px;
  background:#fbfcff;
  border:1px solid #e4eaf2;
  border-radius:22px;
  padding:15px;
  margin:10px 0;
  transition:.2s;
}

.plan:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 20px #0000000d;
}

.plan-icon{
  width:58px;
  height:58px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eaf4ff;
  color:#0866c9;
  font-size:28px;
  font-weight:bold;
}

.plan-info strong{
  display:block;
  font-size:20px;
  color:#092e63;
}

.plan-info small{
  display:block;
  margin-top:5px;
  color:#6b7b91;
  font-size:14px;
}

.price{
  background:#ed182d;
  color:white;
  font-size:18px;
  font-weight:900;
  padding:12px 20px;
  min-width:145px;
  text-align:center;
  border-radius:30px;
  white-space:nowrap;
}

.buy{
  border:none;
  background:#20c967;
  color:white;
  font-size:16px;
  font-weight:bold;
  padding:12px 20px;
  border-radius:30px;
  cursor:pointer;
  white-space:nowrap;
}

.buy:hover{
  background:#18ad57;
}

/* EMPTY */

.empty{
  text-align:center;
  background:white;
  border-radius:20px;
  padding:45px 20px;
  color:#69798c;
}

/* FOOTER */

footer{
  background:#071f49;
  color:white;
  text-align:center;
  padding:30px 15px;
}

.payments{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
}

.payments span{
  background:#ffffff15;
  border-radius:10px;
  padding:9px 18px;
  font-weight:bold;
}

/* MOBILE */

@media(max-width:700px){

  header h1{
    font-size:25px;
  }

  .search{
    flex-direction:column;
  }

  .search button{
    padding:13px;
  }

  .plan{
    grid-template-columns:55px 1fr;
    gap:12px;
    padding:13px;
  }

  .plan-icon{
    width:50px;
    height:50px;
    font-size:24px;
  }

  .plan-info strong{
    font-size:18px;
  }

  .price{
    grid-column:1 / -1;
    width:100%;
  }

  .buy{
    grid-column:1 / -1;
    width:100%;
    padding:13px;
  }

  .country-name{
    font-size:24px;
  }

}

</style>
</head>

/* =================================
BUY
================================= */

function buy(countryIndex,planIndex){

const country=countries[countryIndex];

const plan=country.plans[planIndex];

const message=
`سڵاو 👋

دەمەوێت ئەم پلانەی eSIM بکڕم:

🌍 وڵات: ${country.name}
📦 پلان: ${plan[0]}
📅 ماوە: ${plan[1]}
💰 نرخ: ${plan[2]}

تکایە یارمەتیم بدەن بۆ تەواوکردنی کڕین.`;

const url=
"https://wa.me/"+
WHATSAPP_NUMBER+
"?text="+
encodeURIComponent(message);

/* ئەمە بۆ مۆبایل جێگیرترە */

window.location.href=url;

}


/* =================================
DISPLAY
================================= */

function displayCountries(list=countries){

const container=
document.getElementById("countries");

container.innerHTML="";


if(list.length===0){

container.innerHTML=`

<div class="empty">

<h2>
هیچ پلانێک نەدۆزرایەوە ❌
</h2>

<p style="margin-top:10px">
وشەیەکی تر تاقی بکەرەوە
</p>

</div>

`;

return;

}


list.forEach(country=>{

const countryIndex=
countries.indexOf(country);

let html=`

<section class="country">

<div class="country-head">

<div class="country-name">
${country.name}
</div>

<div class="country-region">
${country.region}
</div>

</div>

<div class="plans">

`;


country.plans.forEach((plan,planIndex)=>{

const icon=
plan[0].toLowerCase()==="unlimited"
?"∞"
:"▮▮▮";


html+=`

<div class="plan">

<div class="plan-icon">
${icon}
</div>


<div class="plan-info">

<strong>
${plan[0]}
</strong>

<small>
ماوە: ${plan[1]}
</small>

</div>


<div class="price">
${plan[2]}
</div>


<button
class="buy"
onclick="buy(${countryIndex},${planIndex})">

🛒 کڕین

</button>

</div>

`;

});


html+=`

</div>

</section>

`;


container.innerHTML+=html;

});

}


/* =================================
FILTERS
================================= */

function createFilters(){

const filters=
document.getElementById("filters");

const regions=[

"هەمووی",
"ئوروپا",
"ئاسیا",
"ئەمەریکا",
"ڕۆژهەڵاتی ناوەڕاست",
"جیهانی"

];


regions.forEach((region,index)=>{

const button=
document.createElement("button");

button.textContent=region;


if(index===0){

button.classList.add("active");

}


button.onclick=()=>{

document
.querySelectorAll(".filters button")
.forEach(b=>
b.classList.remove("active")
);


button.classList.add("active");


if(region==="هەمووی"){

displayCountries(countries);

}else{

displayCountries(

countries.filter(
c=>c.region===region
)

);

}

};


filters.appendChild(button);

});

}


/* =================================
SEARCH
================================= */

function searchPlans(){

const q=
document
.getElementById("search")
.value
.trim()
.toLowerCase();


if(!q){

displayCountries(countries);

return;

}


const result=
countries.filter(country=>{

const countryMatch=
country.name
.toLowerCase()
.includes(q);


const planMatch=
country.plans.some(plan=>

plan.join(" ")
.toLowerCase()
.includes(q)

);


return countryMatch||planMatch;

});


displayCountries(result);

}


/* =================================
ENTER SEARCH
================================= */

document
.getElementById("search")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

searchPlans();

}

});


/* =================================
START
================================= */

createFilters();

displayCountries();
