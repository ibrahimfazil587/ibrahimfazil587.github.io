</div>

<div>

${c.en}
</div>

</div>

</div>

<div class="country-badges">

<div class="country-badge">
📶 eSIM
</div>

<div class="country-badge">
📍 ${c.place}
</div>

</div>

</div>

</div>

<div class="plans">

${c.plans.map((p,pi)=>{

const isUnlimited =
String(p[0]).trim().toLowerCase()==="unlimited";

💰 نرخ: ${p[2]}

تکایە یارمەتیم بدەن بۆ کڕین.`;

window.location.href=
"https://wa.me/"+
WHATSAPP+
"?text="+
encodeURIComponent(message);

}

/* ================= FILTER ================= */

function filterRegion(region,btn){

document
.querySelectorAll(".filter")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

document.getElementById("search").value="";

render(
region==="all"
?countries
:countries.filter(c=>
c.region===region
)
);

/* ================= SEARCH ================= */

function searchPlans(){

const value =
document
.getElementById("search")
.value
.trim()
.toLowerCase();

if(!value){

render(countries);
return;

}

/* Normalize Kurdish / Arabic / English */
const normalize = s =>
String(s)
.toLowerCase()
.replace(/[يى]/g,"ی")
.replace(/ك/g,"ک")
.replace(/ة/g,"ە")
.replace(/ـ/g,"")
.replace(/\s+/g," ")
.trim();

/*
  Search examples:
  Turkey
  تورکیا
  eSIM Turkey
  10GB
  10 GB
  Unlimited
  30 ڕۆژ
  IQD 20,000
*/

const q = normalize(value)
.replace(/(\d+)\s*gb\b/g,"$1 gb")
.replace(/(\d+)\s*mb\b/g,"$1 mb")
.split(/\s+/)
.filter(Boolean);

const result = countries.filter(c => {

const fullText = normalize([
c.name,
c.en,
c.place,
c.region,
c.flag,
c.scene,
"esim",
...c.plans.flat()
].join(" "));

return q.every(word => {

if(/^\d+gb$/.test(word)){

const number = word.replace("gb","");

return (
fullText.includes(number + "gb") ||
fullText.includes(number + " gb")
);

}

if(/^\d+mb$/.test(word)){

const number = word.replace("mb","");

return (
fullText.includes(number + "mb") ||
fullText.includes(number + " mb")
);

}

return fullText.includes(word);

});

});

render(result);

}

render();

</script>
