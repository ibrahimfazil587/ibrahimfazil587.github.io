/* RENDER */

function render(list=countries){

const box=document.getElementById("countries");

box.innerHTML=list.map((c,ci)=>`

<section class="country">

<div
class="country-head"
style="background-image:url('${c.image}')">

<div class="country-title">

<div class="country-left">

<div class="country-flag">
${c.flag}
</div>

<div>

<div class="country-name">
${c.en}
</div>

<div class="country-sub">
✈️ گەشت بۆ ${c.name}
</div>

</div>

</div>

<div class="country-badges">

<div class="country-badge">
📶 eSIM
</div>

<div class="country-badge">
📍 ${c.place}
</div>

</div>

</div>

</div>

<div class="plans">

${c.plans.map((p,pi)=>`

<div class="plan">

<div class="plan-icon">
▮▮▮
</div>

<div class="plan-info">

<div class="plan-data">
${p[0]}
</div>

<div class="plan-days">
${p[1]}
</div>

</div>

<div class="plan-price">
${p[2]}
</div>

<button
class="buy"
onclick="buy(${ci},${pi})">
کڕین 🛒
</button>

</div>

`).join("")}

</div>

</section>

`).join("");

document.getElementById("empty").style.display=
list.length
? "none"
: "block";

}


/* BUY */

function buy(ci,pi){

const c=countries[ci];
const p=c.plans[pi];

const message=`سڵاو 👋

دەمەوێت ئەم پلانەی eSIM بکڕم:

🌍 وڵات: ${c.name}
📦 پلان: ${p[0]}
📅 ماوە: ${p[1]}
💰 نرخ: ${p[2]}

تکایە یارمەتیم بدەن بۆ کڕین.`;

window.location.href=
"https://wa.me/"+
WHATSAPP+
"?text="+
encodeURIComponent(message);

}


/* FILTER */

function filterRegion(region,btn){

document
.querySelectorAll(".filter")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

document.getElementById("search").value="";

render(
region==="all"
?countries
:countries.filter(
c=>c.region===region
)
);

}


/* SEARCH */

function searchPlans(){

const value=
document
.getElementById("search")
.value
.trim()
.toLowerCase();

if(!value){
render(countries);
return;
}

const normalize=s=>
s
.toLowerCase()
.replace(/[يى]/g,"ی")
.replace(/ك/g,"ک")
.replace(/ة/g,"ە");

const q=normalize(value);

render(
countries.filter(c=>
normalize(
[
c.name,
c.en,
c.place,
c.region,
c.flag,
...c.plans.flat()
].join(" ")
).includes(q)
)
);

}


/* START */

render();

</script>
