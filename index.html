function buy(ci,pi){

const c=countries[ci];

const p=c.plans[pi];

const message=
`سڵاو 👋

دەمەوێت ئەم پلانەی eSIM بکڕم:

🌍 وڵات: ${c.name}
📦 پلان: ${p[0]}
📅 ماوە: ${p[1]}
💰 نرخ: ${p[2]}

تکایە یارمەتیم بدەن بۆ کڕین.`;

window.location.href=
"https://wa.me/"+
WHATSAPP+
"?text="+
encodeURIComponent(message);

}


function filterRegion(region,btn){

document.querySelectorAll(".filter")
.forEach(x=>{
x.classList.remove("active");
});

btn.classList.add("active");

if(region==="all"){
render(countries);
return;
}

render(
countries.filter(c=>c.region===region)
);

}


function searchPlans(e){

const value=e.target.value.trim().toLowerCase();

if(!value){
render(countries);
return;
}

const result=countries.filter(c=>{

const countryText=
(
c.name+" "+
c.en+" "+
c.place
).toLowerCase();

const plansText=
c.plans.flat().join(" ").toLowerCase();

return
countryText.includes(value) ||
plansText.includes(value);

});

render(result);

}


render();
