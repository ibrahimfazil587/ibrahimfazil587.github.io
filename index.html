<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f3f7fc;
  color:#111b32;
}

/* TOP */
.top{
  height:76px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.logo{
  font-size:27px;
  font-weight:900;
  color:#075bbb;
}

.logo span{
  color:#e53935;
}

.whatsapp-top{
  background:#20c76a;
  color:white;
  text-decoration:none;
  padding:13px 20px;
  border-radius:16px;
  font-size:15px;
  font-weight:bold;
}

/* HERO */
.hero{
  margin:28px;
  padding:34px 30px;
  border-radius:28px;
  color:white;
  background:
    radial-gradient(circle at 85% 20%,#ffffff22,transparent 22%),
    radial-gradient(circle at 10% 90%,#ffffff18,transparent 28%),
    linear-gradient(135deg,#075bbb,#168ee8);
  overflow:hidden;
  position:relative;
}

.hero:after{
  content:"✈️";
  position:absolute;
  left:25px;
  bottom:-30px;
  font-size:125px;
  opacity:.10;
  transform:rotate(-12deg);
}

.hero h1{
  font-size:34px;
  font-weight:900;
  margin-bottom:9px;
  position:relative;
  z-index:2;
}

.hero p{
  font-size:16px;
  opacity:.92;
  margin-bottom:22px;
  position:relative;
  z-index:2;
}

.search{
  width:100%;
  height:57px;
  border:0;
  outline:0;
  border-radius:18px;
  padding:0 20px;
  font-size:16px;
  color:#333;
  background:#fff;
  position:relative;
  z-index:3;
}

/* FILTERS */
.filters{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:0 28px 22px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  border:0;
  background:#fff;
  color:#075bbb;
  border-radius:16px;
  padding:13px 20px;
  white-space:nowrap;
  font-size:14px;
  font-weight:bold;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  cursor:pointer;
}

.filter.active{
  background:#075bbb;
  color:#fff;
}

/* COUNTRIES */
#countries{
  padding:0 28px 40px;
}

.country{
  margin-bottom:28px;
  background:#fff;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 5px 22px rgba(0,0,0,.07);
}

/* COUNTRY HEADER */
.country-head{
  min-height:190px;
  position:relative;
  overflow:hidden;
  color:#fff;
  padding:28px 25px;
  background:
    linear-gradient(135deg,#075bbb,#168ee8);
}

/* sky/light */
.country-head:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 70% 30%,#ffffff25,transparent 20%),
    linear-gradient(135deg,transparent 50%,#ffffff0d);
}

/* travel decoration */
.country-head:after{
  content:"";
  position:absolute;
  left:-25px;
  bottom:-55px;
  width:420px;
  height:150px;
  background:#063e7525;
  border-radius:50% 50% 0 0;
}

/* LANDMARK */
.country-landmark{
  position:absolute;
  left:32%;
  bottom:-30px;
  font-size:125px;
  line-height:1;
  opacity:.20;
  z-index:1;
  filter:saturate(.7);
  pointer-events:none;
}

/* airplane */
.country-plane{
  position:absolute;
  left:42%;
  top:17px;
  font-size:42px;
  opacity:.30;
  transform:rotate(-8deg);
  z-index:2;
}

/* header content */
.country-title{
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.country-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.country-flag{
  width:76px;
  height:76px;
  border-radius:21px;
  background:#ffffff1c;
  border:1px solid #ffffff50;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  box-shadow:inset 0 0 20px #ffffff0b;
}

.country-name{
  font-size:31px;
  font-weight:900;
}

.country-sub{
  font-size:15px;
  margin-top:7px;
  opacity:.95;
}

.country-badges{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.country-badge{
  border:1px solid #ffffff55;
  background:#ffffff1c;
  border-radius:25px;
  padding:9px 15px;
  font-size:12px;
  white-space:nowrap;
  backdrop-filter:blur(4px);
}

/* PLAN LIST */
.plans{
  padding:13px;
  background:#f9fbfe;
}

/* PLAN CARD */
.plan{
  min-height:84px;
  background:#fff;
  border:1px solid #e9edf3;
  border-radius:20px;
  margin-bottom:10px;
  padding:11px 12px;

  display:flex;
  align-items:center;
  gap:12px;

  box-shadow:0 2px 8px rgba(0,0,0,.025);
}

.plan:last-child{
  margin-bottom:0;
}

/* icon */
.plan-icon{
  width:56px;
  min-width:56px;
  height:56px;
  border-radius:17px;
  background:linear-gradient(145deg,#edf6ff,#dfeefe);
  color:#0764be;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  font-weight:900;
}

/* info */
.plan-info{
  flex:1;
  min-width:90px;
}

.plan-data{
  font-size:23px;
  font-weight:900;
  color:#111b32;
  line-height:1.1;
}

.plan-days{
  font-size:13px;
  color:#9299a7;
  margin-top:6px;
}

/* price */
.plan-price{
  background:#ffe8e8;
  color:#df3333;
  border-radius:22px;
  padding:14px 19px;
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
}

/* buy */
.buy{
  border:0;
  background:linear-gradient(135deg,#16bd63,#0bb95c);
  color:white;
  border-radius:17px;
  padding:15px 22px;
  font-size:16px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(18,190,94,.18);
}

.buy:active{
  transform:scale(.96);
}

/* COLORS */
.turkey{
  background:
    linear-gradient(135deg,#075bbbcc,#168ee8dd),
    #0873ce;
}

.europe{
  background:
    linear-gradient(135deg,#075bbbcc,#168ee8dd),

}

.america{

    linear-gradient(135deg,#124e96,#1877d4);
}

.global{

}

.middle{
  background:
    linear-gradient(135deg,#075bbb,#159bd7);
}

.asia{
  background:
    linear-gradient(135deg,#075bbb,#008fba);
}

.levant{
  background:
    linear-gradient(135deg,#075bbb,#147ed0);
}

/* EMPTY */
.empty{
  background:#fff;
  border-radius:20px;
  padding:40px;
  text-align:center;
  color:#777;
  font-size:16px;

/* BUY */
function buy(ci,pi){

  const c = countries[ci];
  const p = c.plans[pi];

  const message =
`سڵاو 👋

دەمەوێت ئەم پلانەی eSIM بکڕم:

🌍 وڵات: ${c.name}
📦 پلان: ${p[0]}
📅 ماوە: ${p[1]}
💰 نرخ: ${p[2]}

تکایە یارمەتیم بدەن بۆ کڕین.`;

  window.location.href =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(message);
}


/* DISPLAY */
function display(){

  const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const container =
    document.getElementById("countries");

  container.innerHTML="";

  let found=false;

  countries.forEach((c,ci)=>{

    if(
      currentFilter !== "all" &&
      c.class !== currentFilter
    ){
      return;
    }

    const searchable =
      (
        c.name +
        " " +
        c.sub +
        " " +
        c.region +
        " " +
        c.plans
          .map(p=>p.join(" "))
          .join(" ")
      ).toLowerCase();

    if(
      search &&
      !searchable.includes(search)
    ){
      return;
    }

    found=true;

    let plansHTML="";

    c.plans.forEach((p,pi)=>{

      const icon =
        p[0].toLowerCase()
        .includes("unlimited")
        ? "∞"
        : "▮▮▮";

      plansHTML += `

        <div class="plan">

          <div class="plan-icon">
            ${icon}
          </div>

          <div class="plan-info">

            <div class="plan-data">
              ${p[0]}
            </div>

            <div class="plan-days">
              ${p[1]}
            </div>

          </div>

          <div class="plan-price">
            ${p[2]}
          </div>

          <button
            class="buy"
            onclick="buy(${ci},${pi})">
            🛒 کڕین
          </button>

        </div>

      `;
    });


    container.innerHTML += `

      <section class="country">

        <div class="country-head ${c.class}">

          <div class="country-plane">
            ✈️
          </div>

          <div class="country-landmark">
            ${c.landmark}
          </div>

          <div class="country-title">

            <div class="country-left">

              <div class="country-flag">
                ${c.flag}
              </div>

              <div>

                <div class="country-name">
                  ${c.name}
                </div>

                <div class="country-sub">
                  ✈️ ${c.sub}
                </div>

              </div>

            </div>


            <div class="country-badges">

              <div class="country-badge">
                eSIM 📶
              </div>

              <div class="country-badge">
                📍 ${c.region}
              </div>

            </div>

          </div>

        </div>


        <div class="plans">

          ${plansHTML}

        </div>

      </section>

    `;
  });


  if(!found){

    container.innerHTML=`

      <div class="empty">
        🔎 هیچ پلانێک نەدۆزرایەوە
      </div>

    `;
  }
}


/* FILTER */
function setFilter(filter,button){

  currentFilter=filter;

  document
    .querySelectorAll(".filter")
    .forEach(
      x=>x.classList.remove("active")
    );

  button.classList.add("active");

  display();
}


/* SEARCH */
document
  .getElementById("search")
  .addEventListener(
    "input",
    display
  );


/* START */
display();

</script>
