<title>eSIM | پلانەکانی ئینتەرنێت</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.top{
  background:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 12px #0000000d;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:21px;
  font-weight:900;
  color:#075bbb;
}

.logo span{
  color:#e53935;
}

.whatsapp-top{
  background:#20c76a;
  color:#fff;
  text-decoration:none;
  padding:9px 14px;
  border-radius:12px;
  font-size:13px;
  font-weight:bold;
}

.hero{
  margin:15px;
  padding:20px;
  border-radius:22px;
  background:linear-gradient(135deg,#075bbb,#168ee8);
  color:#fff;
}

.hero h1{
  font-size:25px;
  margin-bottom:7px;
  font-weight:900;
}

.hero p{
  font-size:13px;
  opacity:.9;
  margin-bottom:15px;
}

.search{
  width:100%;
  border:0;
  outline:0;
  padding:14px 16px;
  border-radius:14px;
  font-size:14px;
  background:#fff;
  color:#222;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 15px 15px;
}

.filter{
  border:0;
  background:#fff;
  color:#075bbb;
  border-radius:12px;
  padding:9px 14px;
  white-space:nowrap;
  font-weight:bold;
  box-shadow:0 2px 8px #0000000b;
  cursor:pointer;
}

.filter.active{
  background:#075bbb;
  color:#fff;
}

#countries{
  padding:0 15px 30px;
}

.country{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
  box-shadow:0 4px 18px #0000000b;
}

/* COUNTRY HEADER */

.country-head{
  padding:20px 17px;
  color:#fff;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#075bbb,#168ee8);
  min-height:112px;
}

.country-head:before{
  content:"✈";
  position:absolute;
  left:18px;
  top:-18px;
  font-size:100px;
  opacity:.08;
  transform:rotate(-15deg);
}

.country-title{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.country-left{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.country-flag{
  width:57px;
  height:57px;
  min-width:57px;
  background:#ffffff20;
  border:1px solid #ffffff40;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.country-name{
  font-size:23px;
  font-weight:900;
}

.country-sub{
  margin-top:5px;
  font-size:12px;
  opacity:.92;
}

.country-badges{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.country-badge{
  background:#ffffff20;
  border:1px solid #ffffff40;
  padding:6px 9px;
  border-radius:18px;
  font-size:10px;
  white-space:nowrap;
}

/* TRAVEL LANDMARK */

.country-landmark{
  position:absolute;
  right:105px;
  bottom:-22px;
  font-size:86px;
  opacity:.15;
  filter:grayscale(1);
  z-index:1;
}

/* PLAN */

.plans{
  padding:10px;
}

.plan{
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid #edf0f5;
  border-radius:13px;
  padding:9px 8px;
  margin-bottom:7px;
  min-height:58px;
}

.plan:last-child{
  margin-bottom:0;
}

.plan-icon{
  width:35px;
  min-width:35px;
  height:35px;
  border-radius:10px;
  background:#eaf4ff;
  color:#0874d1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:bold;
}

.plan-info{
  flex:1;
  min-width:70px;
}

.plan-data{
  font-size:15px;
  font-weight:900;
  color:#152033;
}

.plan-days{
  font-size:11px;
  color:#8992a3;
  margin-top:3px;
}

.plan-price{
  background:#ffe9e8;
  color:#e53935;
  border-radius:10px;
  padding:8px 9px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}

.buy{
  border:0;
  background:#20bd65;
  color:#fff;
  border-radius:10px;
  padding:9px 11px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
}

.buy:active{
  transform:scale(.96);
}

.empty{
  background:#fff;
  border-radius:16px;
  padding:30px;
  text-align:center;
  color:#777;
}

/* COUNTRY COLORS */

.turkey{background:linear-gradient(135deg,#075bbb,#168ee8)}
.europe{background:linear-gradient(135deg,#1769aa,#168ee8)}
.america{background:linear-gradient(135deg,#124e96,#1877d4)}
.global{background:linear-gradient(135deg,#075bbb,#00a4b8)}
.middle{background:linear-gradient(135deg,#075bbb,#159bd7)}
.asia{background:linear-gradient(135deg,#075bbb,#008fba)}
.levant{background:linear-gradient(135deg,#075bbb,#147ed0)}

@media(max-width:480px){
  .country-name{

  }

  .buy{

    font-size:11px;
  }
}
</style>

function buy(ci,pi){

  const c = countries[ci];
  const p = c.plans[pi];

  const message =
`سڵاو 👋

دەمەوێت ئەم پلانەی eSIM بکڕم:

🌍 وڵات: ${c.name}
📦 پلان: ${p[0]}
📅 ماوە: ${p[1]}
💰 نرخ: ${p[2]}

تکایە یارمەتیم بدەن بۆ کڕین.`;

  window.location.href =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(message);
}


function display(){

  const search =
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  const container =
    document.getElementById("countries");

  container.innerHTML = "";

  let found = false;

  countries.forEach((c,ci)=>{

    if(currentFilter !== "all" && c.class !== currentFilter){
      return;
    }

    const countryText =
      (
        c.name +
        " " +
        c.sub +
        " " +
        c.region +
        " " +
        c.plans.map(x=>x.join(" ")).join(" ")
      ).toLowerCase();

    if(search && !countryText.includes(search)){
      return;
    }

    found = true;

    let plansHTML = "";

    c.plans.forEach((p,pi)=>{

      plansHTML += `
        <div class="plan">

          <div class="plan-icon">📶</div>

          <div class="plan-info">
            <div class="plan-data">${p[0]}</div>
            <div class="plan-days">${p[1]}</div>
          </div>

          <div class="plan-price">${p[2]}</div>

          <button
            class="buy"
            onclick="buy(${ci},${pi})">
            🛒 کڕین
          </button>

        </div>
      `;
    });

    container.innerHTML += `
      <section class="country">

        <div class="country-head ${c.class}">

          <div class="country-landmark">
            ${c.landmark}
          </div>

          <div class="country-title">

            <div class="country-left">

              <div class="country-flag">
                ${c.flag}
              </div>

              <div>
                <div class="country-name">
                  ${c.name}
                </div>

                <div class="country-sub">
                  ✈️ ${c.sub}
                </div>
              </div>

            </div>

            <div class="country-badges">

              <div class="country-badge">
                📶 eSIM
              </div>

              <div class="country-badge">
                📍 ${c.region}
              </div>

            </div>

          </div>

        </div>

        <div class="plans">
          ${plansHTML}
        </div>

      </section>
    `;
  });

  if(!found){
    container.innerHTML = `
      <div class="empty">
        🔎 هیچ پلانێک نەدۆزرایەوە
      </div>
    `;
  }
}


function setFilter(filter,button){

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  display();
}


document
  .getElementById("search")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){
      display();
    }

  });


display();

</script>
